[project]
name = "axiomforge"
version = "0.1.0"
description = "A local personal algorithm workbench built with NiceGUI"
requires-python = ">=3.12"
dependencies = ["nicegui>=3.0,<4"]

[project.scripts]
axiomforge = "axiomforge.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11", "mypy>=1.15"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_untyped_defs = true
