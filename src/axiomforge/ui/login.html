<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · AxiomForge</title>
<style>
:root {color-scheme:light;--bg:#f7f8fc;--surface:#fff;--text:#1f293d;--muted:#71809a;--line:#e2e7f1;--accent:#5546e7;--soft:#eeebff;--error:#a82f3e}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#101726;--surface:#182334;--text:#e4e9f2;--muted:#a1aec1;--line:#303c50;--accent:#9487ff;--soft:#2d2a4f;--error:#ffa5ad}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px/1.6 system-ui,-apple-system,"PingFang SC",sans-serif;color:var(--text);min-height:100vh;display:flex;flex-direction:column}header{height:82px;display:flex;align-items:center;padding:0 40px;border-bottom:1px solid var(--line)}.brand{font-size:25px;font-weight:750;letter-spacing:-.6px;display:flex;gap:12px;align-items:center}.mark{width:34px;height:34px;color:var(--accent)}main{flex:1;display:flex;align-items:center;justify-content:center;padding:56px 24px}.layout{width:960px;display:grid;grid-template-columns:1fr 420px;gap:80px;align-items:center}.eyebrow{color:var(--accent);font-size:13px;font-weight:650;letter-spacing:2px}h1{font-size:36px;line-height:1.4;letter-spacing:-1px;margin:16px 0}.intro p{color:var(--muted);max-width:370px}.scope{margin-top:30px;display:flex;gap:8px;flex-wrap:wrap}.scope span{background:var(--soft);color:var(--accent);padding:5px 10px;border-radius:5px;font-size:12px}.card{padding:34px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 15px 50px #10183808}h2{margin:0 0 6px;font-size:24px}.subtitle{margin:0 0 28px;color:var(--muted);font-size:13px}label{display:block;margin:18px 0 7px;font-size:13px;font-weight:600}input{display:block;width:100%;height:46px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:0 13px;color:var(--text);font:inherit}input:focus{outline:2px solid var(--accent);outline-offset:2px}button{margin-top:26px;width:100%;height:46px;border:0;border-radius:6px;background:#5546e7;color:#fff;font:600 15px system-ui;cursor:pointer}button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.7;cursor:wait}.notice{font-size:12px;color:var(--muted);margin:18px 0 0}.error{padding:10px 12px;background:var(--soft);color:var(--error);border-radius:5px;font-size:13px;margin-bottom:15px}footer{text-align:center;color:var(--muted);font-size:12px;padding:16px}.card-note{border-top:1px solid var(--line);padding-top:17px;margin-top:22px}@media(max-width:800px){header{height:70px;padding:0 24px}.layout{grid-template-columns:1fr;gap:26px;max-width:420px}.intro h1{font-size:28px;margin:8px 0}.intro p,.scope{display:none}.card{padding:26px}main{padding:30px 20px}}
</style>
</head>
<body>
<header><div class="brand"><svg class="mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="m16 3 11 6v14l-11 6-11-6V9zM5 9l11 6 11-6M16 15v14" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/></svg>AxiomForge</div></header>
<main><div class="layout"><section class="intro"><div class="eyebrow">LOCAL WORKBENCH</div><h1>登录你的研究工作台</h1><p>汇集项目数据与分析专题，让每次查询都有清晰的统计口径和依据。</p><div class="scope"><span>项目分析</span><span>用电统计</span><span>AHU 温度</span></div></section>
<section class="card" aria-labelledby="login-title"><h2 id="login-title">账号登录</h2><p class="subtitle">使用有芒市机场项目权限的小麦平台账号。</p><div class="error" role="alert" {{error_hidden}}>{{error}}</div>
<form method="post" action="/login"><input type="hidden" name="csrf" value="{{csrf}}"><label for="account">小麦账号</label><input id="account" name="account" value="{{account}}" autocomplete="username" maxlength="128" required autofocus><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required><button type="submit">登录工作台</button></form>
<p class="notice">账号由小麦平台验证，工作台不保存密码。</p><p class="notice card-note">登录后才能查看项目、查询数据和导出结果。</p></section></div></main>
<footer>Asia/Shanghai · 本地工作台</footer>
<script>document.querySelector('form').addEventListener('submit',()=>{const b=document.querySelector('button');b.disabled=true;b.textContent='正在验证…';});</script>
</body></html>
